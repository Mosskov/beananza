    <path d="M0 -19 C-4 -29 -14 -31 -18 -25 C-13 -18 -5 -17 0 -19 Z" fill="#86B874"/>
    <path d="M0 -19 C4 -29 14 -31 18 -25 C13 -18 5 -17 0 -19 Z" fill="#6A9C5A"/>
  </g>
  <g id="back">
    <path d="M0 3 C1 -5 -1 -13 0 -21" fill="none" stroke="#5A8A4B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 -19 C-5 -29 -17 -31 -21 -25 C-15 -18 -6 -17 0 -19 Z" fill="#86B874"/>
