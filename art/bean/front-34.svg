<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -152 140 168" width="280" height="336" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bean buddy, FRONT 3/4 view (turned to its right = moving down-right). Mirror for down-left. -->
  <g id="shadow"><ellipse cx="0" cy="4" rx="48" ry="9" fill="#3B2F2A" opacity="0.12"/></g>
  <g id="foot-near" data-pivot="-12 0"><ellipse cx="-12" cy="0" rx="13" ry="7" fill="#B8622F"/></g>
  <g id="foot-far" data-pivot="20 0"><ellipse cx="20" cy="0" rx="12" ry="7" fill="#A3572A"/></g>
  <g id="arm-far" data-pivot="40 -52"><path d="M40 -52 q14 10 10 26" fill="none" stroke="#B5633A" stroke-width="10" stroke-linecap="round"/></g>
  <g id="body"><path d="M-46 -4 C-54 -46 -46 -112 0 -114 C46 -112 54 -46 46 -4 C40 6 -40 6 -46 -4 Z" fill="#E08A5B"/></g>
  <g id="belly"><ellipse cx="10" cy="-24" rx="24" ry="18" fill="#F2B48C"/></g>
  <g id="scarf"><path d="M-42 -54 Q0 -40 42 -54 L42 -44 Q0 -30 -42 -44 Z" fill="#F6C66B"/></g>
  <g id="scarf-tail" data-pivot="30 -42"><path d="M30 -42 L34 -20 L44 -23 L40 -44 Z" fill="#E3A93B"/></g>
  <g id="eyes" data-pivot="10 -80">
    <ellipse cx="-4" cy="-80" rx="6" ry="8" fill="#2B211C"/><ellipse cx="24" cy="-80" rx="5" ry="7.5" fill="#2B211C"/>
    <circle cx="-2" cy="-83" r="2.2" fill="#FFFFFF"/><circle cx="26" cy="-83" r="2" fill="#FFFFFF"/>
  </g>
  <g id="cheeks"><ellipse cx="-17" cy="-66" rx="7" ry="4" fill="#F08F7A" opacity="0.6"/><ellipse cx="35" cy="-66" rx="5" ry="3.5" fill="#F08F7A" opacity="0.6"/></g>
  <g id="mouth"><path d="M5 -66 q6 6 12 0" fill="none" stroke="#2B211C" stroke-width="2.5" stroke-linecap="round"/></g>
  <!-- Reaction faces (D26; hidden unless a reaction shows them): Eureka! (happy eyes, open smile) and Oops (squeezed eyes, wavy mouth). -->
  <g id="eyes-happy"><path d="M-10 -78 q6 -9 12 0 M19.5 -78 q4.5 -8 9 0" fill="none" stroke="#2B211C" stroke-width="3.2" stroke-linecap="round"/></g>
  <g id="mouth-open"><path d="M4 -68 q7 12 14 0 Z" fill="#7A3B2E"/><ellipse cx="11" cy="-63.8" rx="3" ry="1.6" fill="#E07A55"/></g>
  <g id="eyes-squeeze"><path d="M-9 -86 l10 6 l-10 6 M29 -86 l-9 5.5 l9 5.5" fill="none" stroke="#2B211C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="mouth-wavy"><path d="M3 -65 q4 -4.5 8 0 q4 4.5 8 0" fill="none" stroke="#2B211C" stroke-width="2.5" stroke-linecap="round"/></g>
  <g id="eye-spiral-a" data-pivot="-4 -80"><path d="M-4 -80 A1.47 1.47 0 0 0 -6.94 -80 A2.94 2.94 0 0 0 -1.06 -80 A4.41 4.41 0 0 0 -9.88 -80 A5.88 5.88 0 0 0 1.88 -80" fill="none" stroke="#2B211C" stroke-width="2.4" stroke-linecap="round"/></g>
  <g id="eye-spiral-b" data-pivot="24 -80"><path d="M24 -80 A1.26 1.26 0 0 1 26.52 -80 A2.52 2.52 0 0 1 21.48 -80 A3.78 3.78 0 0 1 29.04 -80 A5.04 5.04 0 0 1 18.96 -80" fill="none" stroke="#2B211C" stroke-width="2.4" stroke-linecap="round"/></g>
  <g id="headwear-goggles">
    <path d="M-44 -98 Q4 -112 46 -96" fill="none" stroke="#6B4A36" stroke-width="5"/>
    <circle cx="-4" cy="-102" r="10" fill="#BFE3EA" stroke="#6B4A36" stroke-width="4"/><ellipse cx="24" cy="-102" rx="8" ry="10" fill="#BFE3EA" stroke="#6B4A36" stroke-width="4"/>
  </g>
  <g id="arm-near" data-pivot="-42 -50"><path d="M-42 -50 q-16 10 -12 26" fill="none" stroke="#C96F42" stroke-width="10" stroke-linecap="round"/></g>
  <!-- Anchors (never drawn): headwear sits at the top of the body. -->
  <g id="anchors" display="none"><circle id="anchor-headwear" cx="0" cy="-114" r="0"/><circle id="anchor-fx-head" cx="32" cy="-124" r="0"/><circle id="anchor-fx-brow" cx="-20" cy="-96" r="0"/><circle id="anchor-fx-ground" cx="0" cy="0" r="0"/></g>
