<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -152 140 168" width="280" height="336" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bean buddy, SIDE view facing right. Mirror for left. arm-far is only shown when pushing. -->
  <g id="shadow"><ellipse cx="4" cy="4" rx="44" ry="9" fill="#3B2F2A" opacity="0.12"/></g>
  <g id="foot-far" data-pivot="-2 0"><ellipse cx="-2" cy="0" rx="13" ry="7" fill="#A3572A"/></g>
  <g id="arm-far-push" data-pivot="-2 -60" visibility="hidden"><path d="M-2 -60 q22 -8 46 -4" fill="none" stroke="#B5633A" stroke-width="10" stroke-linecap="round"/></g>
  <g id="scarf-tail" data-pivot="-36 -50"><path d="M-36 -50 L-60 -40 L-56 -30 L-34 -42 Z" fill="#E3A93B"/></g>
  <g id="body"><path d="M-40 -4 C-48 -46 -42 -112 2 -114 C46 -112 52 -46 44 -4 C38 6 -34 6 -40 -4 Z" fill="#E08A5B"/></g>
  <g id="belly"><path d="M46.9 -42 C47.3 -30.3 46.4 -18.5 44.7 -8 C14 -12 14 -38 46.9 -42 Z" fill="#F2B48C"/></g>
  <g id="scarf"><path d="M-42 -54 Q2 -42 46 -54 L46 -44 Q2 -32 -42 -44 Z" fill="#F6C66B"/></g>
  <g id="eyes" data-pivot="25 -80"><ellipse cx="25" cy="-80" rx="5.5" ry="8" fill="#2B211C"/><circle cx="27" cy="-83" r="2" fill="#FFFFFF"/></g>
  <g id="cheeks"><ellipse cx="35" cy="-66" rx="5" ry="3.5" fill="#F08F7A" opacity="0.6"/></g>
  <g id="mouth"><path d="M37 -66 q4 4 8 0" fill="none" stroke="#2B211C" stroke-width="2.5" stroke-linecap="round"/></g>
  <g id="headwear-goggles">
    <path d="M-42 -96 Q-8 -110 20 -105" fill="none" stroke="#6B4A36" stroke-width="5"/>
    <ellipse cx="27" cy="-103" rx="7" ry="10" fill="#BFE3EA" stroke="#6B4A36" stroke-width="4"/>
  </g>
  <g id="arm-near" data-pivot="2 -50"><path d="M2 -50 q10 12 4 28" fill="none" stroke="#C96F42" stroke-width="10" stroke-linecap="round"/></g>
  <g id="foot-near" data-pivot="12 0"><ellipse cx="12" cy="0" rx="13" ry="7" fill="#B8622F"/></g>
  <!-- Anchors (never drawn): headwear sits at the top of the body; lean is the point whose forward tip the pushing stand-off adds. -->
  <g id="anchors" display="none"><circle id="anchor-headwear" cx="2" cy="-114" r="0"/><circle id="anchor-lean" cx="0" cy="-40" r="0"/></g>
</svg>
