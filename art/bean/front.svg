<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -152 140 168" width="280" height="336" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bean buddy, FRONT view. Origin (0,0) = ground point between the feet. Groups are rig parts. -->
  <g id="shadow"><ellipse cx="0" cy="4" rx="48" ry="9" fill="#3B2F2A" opacity="0.12"/></g>
  <g id="foot-left" data-pivot="-18 0"><ellipse cx="-18" cy="0" rx="13" ry="7" fill="#B8622F"/></g>
  <g id="foot-right" data-pivot="18 0"><ellipse cx="18" cy="0" rx="13" ry="7" fill="#B8622F"/></g>
  <g id="arm-left" data-pivot="-44 -50"><path d="M-44 -50 q-18 8 -14 26" fill="none" stroke="#C96F42" stroke-width="10" stroke-linecap="round"/></g>
  <g id="arm-right" data-pivot="44 -50"><path d="M44 -50 q18 8 14 26" fill="none" stroke="#C96F42" stroke-width="10" stroke-linecap="round"/></g>
  <g id="body"><path d="M-46 -4 C-54 -46 -46 -112 0 -114 C46 -112 54 -46 46 -4 C40 6 -40 6 -46 -4 Z" fill="#E08A5B"/></g>
  <g id="belly"><ellipse cx="0" cy="-24" rx="26" ry="18" fill="#F2B48C"/></g>
  <g id="scarf"><path d="M-42 -54 Q0 -40 42 -54 L42 -44 Q0 -30 -42 -44 Z" fill="#F6C66B"/></g>
  <g id="scarf-tail" data-pivot="20 -42"><path d="M20 -42 L26 -20 L36 -22 L30 -44 Z" fill="#E3A93B"/></g>
  <g id="eyes" data-pivot="0 -80">
    <ellipse cx="-15" cy="-80" rx="6" ry="8" fill="#2B211C"/><ellipse cx="15" cy="-80" rx="6" ry="8" fill="#2B211C"/>
    <circle cx="-13" cy="-83" r="2.2" fill="#FFFFFF"/><circle cx="17" cy="-83" r="2.2" fill="#FFFFFF"/>
  </g>
  <g id="cheeks"><ellipse cx="-27" cy="-66" rx="7" ry="4" fill="#F08F7A" opacity="0.6"/><ellipse cx="27" cy="-66" rx="7" ry="4" fill="#F08F7A" opacity="0.6"/></g>
  <g id="mouth"><path d="M-6 -66 q6 6 12 0" fill="none" stroke="#2B211C" stroke-width="2.5" stroke-linecap="round"/></g>
  <g id="headwear-goggles">
    <path d="M-44 -98 Q0 -112 44 -98" fill="none" stroke="#6B4A36" stroke-width="5"/>
    <circle cx="-14" cy="-102" r="10" fill="#BFE3EA" stroke="#6B4A36" stroke-width="4"/><circle cx="14" cy="-102" r="10" fill="#BFE3EA" stroke="#6B4A36" stroke-width="4"/>
  </g>
  <!-- Dozing on the bench (hidden unless dozing): closed eyes, and a drawn "z" that floats up (a shape, not text). -->
  <g id="eyes-sleep"><path d="M-21 -80 q6 5 12 0 M9 -80 q6 5 12 0" fill="none" stroke="#2B211C" stroke-width="3" stroke-linecap="round"/></g>
  <g id="doze-z" data-pivot="32 -124"><path d="M26 -130 H38 L26 -118 H38" fill="none" stroke="#5A4A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 -142 H47 L40 -135 H47" fill="none" stroke="#5A4A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- Anchors (never drawn): headwear sits at the top of the body. -->
  <g id="anchors" display="none"><circle id="anchor-headwear" cx="0" cy="-114" r="0"/></g>
</svg>
