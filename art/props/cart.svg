<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -90 120 104" width="240" height="208">
  <!-- Mine cart on the east-west rail, seen from the south in the 3/4 view. One drawing: carts on a
       straight rail never turn (D12). Origin (0,0) = the ground under the cart's centre; 0.8 m long,
       rim 0.48 m high. 100 units = 1 m. Draw order: shadow on the ground; back (and rocks, only for the
       loaded cart) behind a rider; then front and wheels in front of a rider. Wheels roll about their
       centres. -->
  <g id="shadow"><ellipse cx="0" cy="4" rx="46" ry="8" fill="#3B2F2A" opacity="0.16"/></g>
  <g id="back">
    <path d="M-40 -48 L40 -48 L34 -58 L-34 -58 Z" fill="#5E3F2A"/>
    <path d="M-34 -58 L34 -58 L32 -55 L-32 -55 Z" fill="#4B3122"/>
  </g>
  <g id="rocks">
    <circle cx="-18" cy="-60" r="11" fill="#9A948A"/>
    <circle cx="20" cy="-59" r="10" fill="#9A948A"/>
    <circle cx="2" cy="-65" r="12" fill="#ADA79D"/>
    <circle cx="-2" cy="-69" r="4" fill="#C4BFB6"/>
    <circle cx="-21" cy="-64" r="3.5" fill="#B4AFA6"/>
  </g>
  <g id="front">
    <path d="M-40 -48 L40 -48 L34 -6 L-34 -6 Z" fill="#8A5C3C"/>
    <path d="M-37 -26 L37 -26 L34 -6 L-34 -6 Z" fill="#7A4F33"/>
    <path d="M-38 -34 H38 M-36 -20 H36" stroke="#6B4A36" stroke-width="1.5"/>
    <path d="M-40 -48 H40" stroke="#C99A6B" stroke-width="3"/>
    <rect x="-39" y="-47" width="6" height="40" rx="1.5" fill="#6B6F7A"/>
    <rect x="33" y="-47" width="6" height="40" rx="1.5" fill="#6B6F7A"/>
    <circle cx="-36" cy="-40" r="1.5" fill="#C4BFB6"/><circle cx="-36" cy="-14" r="1.5" fill="#C4BFB6"/>
    <circle cx="36" cy="-40" r="1.5" fill="#C4BFB6"/><circle cx="36" cy="-14" r="1.5" fill="#C4BFB6"/>
  </g>
  <g id="wheel-west">
    <circle cx="-24" cy="-9" r="9" fill="#3B4A6B"/>
    <path d="M-31 -9 H-17 M-24 -16 V-2" stroke="#8E9AAE" stroke-width="2"/>
    <circle cx="-24" cy="-9" r="2.5" fill="#C4BFB6"/>
  </g>
  <g id="wheel-east">
    <circle cx="24" cy="-9" r="9" fill="#3B4A6B"/>
    <path d="M17 -9 H31 M24 -16 V-2" stroke="#8E9AAE" stroke-width="2"/>
    <circle cx="24" cy="-9" r="2.5" fill="#C4BFB6"/>
  </g>
</svg>
