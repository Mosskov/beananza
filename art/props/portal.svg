<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -170 160 200" width="320" height="400">
  <!-- Region portal (D2), seen from the south in the 3/4 view: a stone ring standing on a plinth,
       with a swirl inside. One drawing for every region (D12): the swirl is drawn in white and
       greys, and the game tints it in the region's colour. Origin (0,0) = the middle of its
       footprint on the ground (1.3 x 0.4 m in the sim; the sim does not make it solid).
       100 units = 1 m. The swirl turns about its centre (data-pivot). Parts in draw order: the
       game draws shadow, base and swirl behind a bean that is entering, ring and lock in front. -->
  <g id="shadow"><ellipse cx="0" cy="4" rx="72" ry="16" fill="#3B2F2A" opacity="0.15"/></g>
  <g id="base">
    <rect x="-66" y="-8" width="132" height="13" rx="5" fill="#D5C4A1"/>
    <rect x="-66" y="-20" width="132" height="15" rx="7" fill="#E9DCC0"/>
    <path d="M-60 -9 H60" stroke="#C4B08A" stroke-width="2"/>
  </g>
  <g id="swirl" data-pivot="0 -86">
    <circle cx="0" cy="-86" r="47" fill="#FFFFFF"/>
    <circle cx="0" cy="-86" r="41" fill="none" stroke="#DADADA" stroke-width="5"/>
    <path d="M0 -86 C 18 -96, 30 -80, 32 -62" fill="none" stroke="#C4C4C4" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -86 C -10 -106, -30 -104, -38 -90" fill="none" stroke="#C4C4C4" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -86 C -8 -66, 4 -50, 20 -46" fill="none" stroke="#C4C4C4" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -86 C 12 -106, 30 -112, 38 -104" fill="none" stroke="#DADADA" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-86" r="12" fill="#E8E8E8"/>
    <circle cx="-14" cy="-104" r="4" fill="#FFFFFF"/>
    <circle cx="22" cy="-72" r="3" fill="#FFFFFF"/>
  </g>
  <g id="ring">
    <rect x="-47" y="-50" width="14" height="34" rx="4" fill="#B9A583"/>
    <rect x="33" y="-50" width="14" height="34" rx="4" fill="#A8946F"/>
    <circle cx="0" cy="-86" r="52" fill="none" stroke="#B9A583" stroke-width="13"/>
    <path d="M-50 -100 A52 52 0 0 1 50 -100" fill="none" stroke="#E9DCC0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-86" r="45.5" fill="none" stroke="#9C8866" stroke-width="2"/>
    <rect x="-10" y="-148" width="20" height="16" rx="4" fill="#D5C4A1"/>
  </g>
  <g id="lock">
    <path d="M-44 -106 L44 -66" stroke="#8A5C3C" stroke-width="12" stroke-linecap="round"/>
    <path d="M-44 -66 L44 -106" stroke="#8A5C3C" stroke-width="12" stroke-linecap="round"/>
    <path d="M-44 -106 L44 -66 M-44 -66 L44 -106" stroke="#C99A6B" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -84 V-94 A10 10 0 0 1 10 -94 V-84" fill="none" stroke="#4C596B" stroke-width="5"/>
    <rect x="-15" y="-86" width="30" height="24" rx="4" fill="#6F7F96"/>
    <circle cx="0" cy="-76" r="3.5" fill="#3B2F2A"/>
  </g>
  <!-- Anchors (never drawn): the swirl's centre, 0.86 m up, where an entering bean floats to. -->
  <g id="anchors" display="none"><circle id="anchor-swirl" cx="0" cy="-86" r="0"/></g>
</svg>
